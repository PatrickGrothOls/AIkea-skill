name: overall-wardrobe-measurements-and-settings
type: eval_set
skill: aikea
run_mode: manual_fresh_chat
purpose: Score how AIkea guides a client through wardrobe measurements and choices while privately writing the global project file.
environment_guide: manual-eval-environment.md

manual_run:
  - Start a fresh Claude or Codex chat with the AIkea skill available.
  - Send each user message in order and save the response from every turn.
  - Compare the response and project file with that turn's answer key.
  - Record the model, pass or fail result, and short failure notes separately.

scoring:
  required_item_points: 1
  forbidden_item_result: fail_case
  project_file_result: exact_semantic_match
  calculated_result: numeric_match
  pass_when:
    - Every required response item is satisfied.
    - No forbidden response item occurs.
    - The final aikea.yaml semantically matches expected_aikea_yaml.
    - The calculator succeeds and matches expected_calculated.
    - The model completes and validates aikea.yaml before beginning later cabinet design.
  always_forbidden:
    - Invent measurements or typical cabinet defaults.
    - Reuse measurements from skill assets, eval cases, development docs, legacy code, or another project.
    - Ask the client to provide width shares or a numeric width-share list.
    - Mention aikea.yaml, the global specification, schemas, field names, calculators, validation mechanics, or the built-in fitting allowance unless the client asks for technical details.
    - Present a raw data-entry template unless the client asks for a site measurement sheet.
    - Ask about more than one missing measurement or design topic in a response unless providing the requested site measurement sheet.
    - Continue into another design stage instead of stopping after the checked overall results.

cases:
  - name: flat two-bay freestanding wardrobe
    wardrobe_type: freestanding, flat top, equal-width bays
    turns:
      - user: >-
          Design a freestanding two-door wardrobe. All measurements are in centimetres.
          The wall widths at the bottom, middle, and top are all 240. The available
          depths at the left, centre, and right are all 60. Floor-to-ceiling height is
          220 at the left edge, centre, and right edge, at distances 0, 120, and 240.
          Use two equal cabinets, 1 cm clearance on both sides and above, a 0.2 cm
          cabinet gap, a 10 cm base, a 0.2 cm door gap, 1.8 cm cabinet and door
          panels, and a 0.6 cm back panel.
        answer_key:
          response_required:
            - Recognize that every required overall input has been supplied.
            - Write a complete aikea.yaml using centimetres without changing the measurements.
            - Run the overall wardrobe calculator privately and present the checked cabinet dimensions in client-facing language.
          response_forbidden:
            - Ask a follow-up measurement question.
          expected_aikea_yaml:
            schema_version: 2
            units: cm
            measured_space:
              width_measurements: {bottom: 240, middle: 240, top: 240}
              depth_measurements: {left: 60, middle: 60, right: 60}
              height_measurements:
                - {distance_from_left: 0, height_from_floor: 220}
                - {distance_from_left: 120, height_from_floor: 220}
                - {distance_from_left: 240, height_from_floor: 220}
            design_settings:
              fit_allowance: 0.2
              cabinet_run:
                cabinet_count: 2
                cabinet_width_shares: [1, 1]
                left_clearance: 1
                right_clearance: 1
                cabinet_gap: 0.2
                ceiling_clearance: 1
              base: {height: 10}
              doors: {gap: 0.2}
              materials:
                cabinet_panel_thickness: 1.8
                door_thickness: 1.8
                back_panel_thickness: 0.6
          expected_calculated:
            minimum_measured_width_mm: 2400
            minimum_measured_depth_mm: 600
            fit_allowance_mm: 2
            usable_width_mm: 2398
            usable_depth_mm: 598
            cabinet_depth_mm: 580
            inside_depth_mm: 574
            cabinets:
              - {cabinet_number: 1, left_position_mm: 10, right_position_mm: 1198, width_mm: 1188, left_height_mm: 2088, right_height_mm: 2088, door_width_mm: 1186}
              - {cabinet_number: 2, left_position_mm: 1200, right_position_mm: 2388, width_mm: 1188, left_height_mm: 2088, right_height_mm: 2088, door_width_mm: 1186}

  - name: flat three-bay wardrobe supplied one topic at a time
    wardrobe_type: built-in, flat top, equal-width bays, supplied in stages
    turns:
      - user: I want to build a built-in wardrobe for a bedroom wall. I have not measured anything yet. Help me start.
        answer_key:
          response_required:
            - Sound like a carpenter helping the client begin measuring the space.
            - Ask which unit the client will use.
          response_forbidden:
            - Ask for dimensions or wardrobe choices in the same response.
            - Create a project file before any project value has been supplied.
          expected_project_state: absent
      - user: Millimetres.
        answer_key:
          response_required:
            - Retain millimetres as the unit.
            - Ask for wall-to-wall widths near the floor, halfway up, and near the ceiling.
          response_forbidden:
            - Ask for depth, height, or wardrobe choices yet.
          expected_project_state: incomplete_or_absent
      - user: The bottom, middle, and top widths are all 2730 mm.
        answer_key:
          response_required:
