name: overall-wardrobe-measurements-and-settings
type: eval_set
skill: aikea
run_mode: manual_fresh_chat
purpose: Score how AIkea guides a client through wardrobe measurements and choices while privately writing the global project file.
environment_guide: manual-eval-environment.md

fixture_material_decisions: &fixture_material_decisions
  - subject: cabinet_carcass_material
    decision: Evaluation fixture cabinet panel
    design_effect: Use the approved fixture product at the project thickness.
    client_statement: The exact fixture product and sample are already approved.
  - subject: door_front_material
    decision: Evaluation fixture door panel
    design_effect: Use the approved fixture product at the project thickness.
    client_statement: The exact fixture product and sample are already approved.
  - subject: back_panel_material
    decision: Evaluation fixture back panel
    design_effect: Use the approved fixture product at the project thickness.
    client_statement: The exact fixture product and sample are already approved.

manual_run:
  - Start a fresh Claude or Codex chat with the AIkea skill available.
  - Prepend this shared fact to the first user message in every case: "The exact Evaluation fixture cabinet panel, Evaluation fixture door panel, and Evaluation fixture back panel are already approved for this project, including their visible samples; preserve those choices at the thicknesses I provide."
  - Send each user message in order and save the response from every turn.
  - Compare the response and project file with that turn's answer key.
  - Record the model, pass or fail result, and short failure notes separately.

scoring:
  required_item_points: 1
  forbidden_item_result: fail_case
  project_file_result: exact_semantic_match
  calculated_result: numeric_match
  pass_when:
    - Every required response item is satisfied.
    - No forbidden response item occurs.
    - Every requested reading appears on its own numbered line and can be answered by item number and value.
    - Every measurement group has a Width, Height, or Depth headline and a compact ASCII guide whose numbered paths match the requested readings.
    - Every measurement line uses the form measurement description, colon, and where to measure, without a blank value field.
    - Every design question uses numbered choices or one numbered value line and can be answered by number.
    - Every client-facing edge letter is paired with its plain name in parentheses.
    - The final aikea.yaml semantically matches expected_aikea_yaml.
    - The three shared, already approved fixture material decisions are preserved exactly.
    - The calculator succeeds and matches expected_calculated.
    - The model completes and validates aikea.yaml before beginning later cabinet design.
    - Every response ends with one concrete next action; it asks the client a question only when their answer can change the design, otherwise it proceeds automatically.
    - Progress updates describe the current physical-design task and why its result matters to the client, using natural wording grounded in the active project.
  always_forbidden:
    - Invent measurements or typical cabinet defaults.
    - Reuse measurements from skill assets, eval cases, development docs, legacy code, or another project.
    - Ask the client to provide width shares or a numeric width-share list.
    - Mention aikea.yaml, the global specification, schemas, field names, calculators, validation mechanics, or the built-in fitting allowance unless the client asks for technical details.
    - Present a raw data-entry template unless the client asks for a site measurement sheet.
    - Ask about more than one missing measurement or design topic in a response unless providing the requested site measurement sheet.
    - Ask how the wardrobe is fitted before establishing and labelling its front-view shape.
    - Split the labelled-edge fit question into separate questions about individual sides.
    - Drop the edge labels after drawing the outline and ask for a measurement using ambiguous positions alone.
    - Use a bare edge letter in a client-facing question without its plain name in parentheses.
    - Request measurements in prose or unnumbered bullets instead of numbered lines.
    - Ask for a measurement without a direction headline or matching ASCII guide.
    - Mix width, height, and depth paths in one ASCII guide.
    - Add underscores, blanks, or pretend value fields after a numbered measurement description.
    - Present design alternatives without numbered reply choices.
    - Request a repeated reading that reaches a different boundary or reveals no useful fit information merely to complete a standard count.
    - Ask whether the wardrobe front is enclosed; it remains open even when its finished face must align with a fixed line.
    - Subtract the fitting allowance from a dimension that is not fitted at both ends.
    - Treat one wall and one open side as a fitted width.
    - Ask for three width or height readings after the client established an open end, or three depth readings after establishing a freely chosen depth.
    - Ask for only one width or height reading when fitted at both ends, or one depth reading when the front must finish at a fixed flush line.
    - Begin a new-project conversation with a blunt data request instead of a warm, service-minded acknowledgement.
    - Announce that it is using an AIkea skill or workflow, quote or summarize its instructions, or narrate internal operations such as saving YAML, validating, loading a skill, or recording assembly_run.
    - Reuse canned example wording instead of composing a project-specific update.
    - End with a passive invitation such as ready when you are, let me know, or tell me when to continue.

cases:
  - name: flat two-bay freestanding wardrobe
    wardrobe_type: freestanding, flat top, equal-width bays
    turns:
      - user: >-
          Design a rectangular freestanding two-door wardrobe with open space at both sides,
          above it, and in front. All measurements are in centimetres.
          The intended overall width is 240, the depth from the back to the front is
          60, the front does not need to align with a fixed line, and the intended
          wardrobe height is 220.
          Use two equal cabinets, 1 cm clearance on both sides and above, a 0.2 cm
          cabinet gap, a 10 cm base, a 0.2 cm door gap, 1.8 cm cabinet and door
          panels, and a 0.6 cm back panel.
        answer_key:
          response_required:
            - Recognize that every required overall input has been supplied.
            - Write a complete aikea.yaml using centimetres without changing the measurements.
            - Run the overall wardrobe calculator privately and present the checked cabinet dimensions in client-facing language.
          response_forbidden:
            - Ask a follow-up measurement question.
          expected_aikea_yaml:
            schema_version: 8
            units: cm
            measured_space:
              top_boundary: flat
              width_measurements: {single: 240}
              depth_measurements: {single: 60}
              height_measurements:
                - {distance_from_left: 0, height_from_floor: 220}
            design_decisions: *fixture_material_decisions
            design_settings:
              fit_allowance: 0.2
              fitted_dimensions: {width: false, depth: false, height: false}
              cabinet_run:
                cabinet_count: 2
                cabinet_width_shares: [1, 1]
                left_clearance: 1
                right_clearance: 1
                cabinet_gap: 0.2
                ceiling_clearance: 1
              base: {height: 10}
              doors: {gap: 0.2}
              materials:
                cabinet_panel_thickness: 1.8
                door_thickness: 1.8
                back_panel_thickness: 0.6
          expected_calculated:
            minimum_measured_width_mm: 2400
            minimum_measured_depth_mm: 600
            width_fitting_allowance_mm: 0
            depth_fitting_allowance_mm: 0
            height_fitting_allowance_mm: 0
            usable_width_mm: 2400
            usable_depth_mm: 600
            cabinet_depth_mm: 582
            inside_depth_mm: 576
            cabinets:
              - {cabinet_number: 1, left_position_mm: 10, right_position_mm: 1199, width_mm: 1189, left_height_mm: 2090, right_height_mm: 2090, door_width_mm: 1187}
              - {cabinet_number: 2, left_position_mm: 1201, right_position_mm: 2390, width_mm: 1189, left_height_mm: 2090, right_height_mm: 2090, door_width_mm: 1187}

  - name: flat three-bay wardrobe supplied one topic at a time
    wardrobe_type: built-in, flat top, equal-width bays, supplied in stages
    turns:
      - user: I want to build a built-in wardrobe for a bedroom wall. I have not measured anything yet. Help me start.
        answer_key:
          response_required:
            - Warmly acknowledge that the client is starting a wardrobe project.
            - Ask which unit the client will use and offer centimetres, millimetres, and inches.
          response_forbidden:
            - Ask for dimensions or wardrobe choices in the same response.
            - Create a project file before any project value has been supplied.
          expected_project_state: absent
      - user: Millimetres.
        answer_key:
          response_required:
            - Retain millimetres as the unit.
            - Ask only for the shape of the available space as viewed from the front.
          response_forbidden:
            - Ask how the wardrobe is fitted or ask for dimensions in the same response.
          expected_project_state: incomplete_or_absent
      - user: It is a rectangle.
        answer_key:
          response_required:
            - Show a compact rectangular outline labelled clockwise as A left, B top, C right, and D floor.
            - Ask one question covering whether every labelled edge is fitted and, if not, which letters are open.
          response_forbidden:
            - Ask about the left, right, top, or floor as separate placement questions.
            - Ask for dimensions in the same response.
          expected_project_state: incomplete_or_absent
      - user: All four labelled edges are fitted against the room.
        answer_key:
          response_required:
            - Retain that the left, top, right, and floor edges are all fitted.
            - Ask only whether the wardrobe front must finish flush with a wall or another fixed line.
          response_forbidden:
            - Ask whether the wardrobe front is enclosed.
            - Mention internal fitted-dimension fields or the fitting allowance.
          expected_project_state: incomplete_or_absent
      - user: No, the wardrobe can use a freely chosen depth.
        answer_key:
          response_required:
            - Retain that the depth is freely chosen.
            - Ask for widths between labelled side edges A and C just above floor edge D, midway up their shared height, and just below top edge B.
            - Make clear that the three lines compare the same two walls and can reveal lean, bow, or taper.
          response_forbidden:
            - Ask for the depth or height in the same response.
          expected_project_state: incomplete_or_absent
      - user: The bottom, middle, and top widths are all 2730 mm.
        answer_key:
          response_required:
            - Retain all three width readings.
            - Ask for one depth from the back wall to the intended wardrobe front at a labelled location, such as midway along floor edge D between A and C.
          response_forbidden:
            - Ask for three depth readings after the client said the depth is freely chosen.
          expected_project_state: incomplete_or_absent
      - user: Make the wardrobe 620 mm deep from the back wall to the front.
        answer_key:
          response_required:
            - Retain the single depth reading.
            - Ask for vertical heights from floor edge D to top edge B beside A, midway between A and C, and beside C, with their distances from A, plus any labelled top junction where the ceiling changes.
          response_forbidden:
            - Ask for wardrobe choices yet.
          expected_project_state: incomplete_or_absent
      - user: Heights are 2400 mm at 0, 1365, and 2730 mm from the left. There are no changes between them.
        answer_key:
          response_required:
            - Retain all three heights and recognize that the measured space is complete.
            - Ask how many wardrobe sections the client wants.
          response_forbidden:
            - Ask again how the wardrobe will sit.
          expected_project_state: incomplete_or_absent
      - user: Three sections.
        answer_key:
          response_required:
            - Ask whether the sections should be equal or whether any should be wider or narrower.
          response_forbidden:
            - Ask the client for numeric width shares.
            - Ask about clearances or other choices in the same response.
          expected_project_state: incomplete_or_absent
      - user: Make all three the same width.
        answer_key:
          response_required:
            - Translate the answer to three equal internal width relationships.
            - Ask about the intended room at the left wall, right wall, and below the ceiling.
          response_forbidden:
            - Explain width shares to the client.
            - Ask about cabinet gaps or other choices in the same response.
          expected_project_state: incomplete_or_absent
      - user: Use 10 mm at both walls and 20 mm below the ceiling.
        answer_key:
          response_required:
            - Retain the three supplied outer clearances.
            - Ask for the gap between neighbouring cabinets.
          response_forbidden:
            - Ask about the base or other choices in the same response.
          expected_project_state: incomplete_or_absent
      - user: Use 5 mm between cabinets.
        answer_key:
          response_required:
            - Ask how high the base should be.
          response_forbidden:
            - Ask about doors or materials in the same response.
          expected_project_state: incomplete_or_absent
      - user: Make the base 100 mm high.
        answer_key:
          response_required:
            - Ask for the visible gap around or between the doors.
          response_forbidden:
            - Ask about materials in the same response.
          expected_project_state: incomplete_or_absent
      - user: Use a 2 mm door gap.
        answer_key:
          response_required:
            - Ask for cabinet-panel, door-panel, and back-panel thicknesses as one material topic.
          response_forbidden:
            - Ask again for an earlier answer.
          expected_project_state: incomplete_or_absent
      - user: Cabinet panels are 18 mm, doors are 20 mm, and the back is 6 mm.
        answer_key:
          response_required:
            - Write the complete aikea.yaml using values retained from the entire conversation.
            - Run the overall wardrobe calculator privately and present the checked cabinet dimensions in client-facing language.
          response_forbidden:
            - Ask for a value supplied in an earlier turn.
            - Begin later cabinet or construction design.
          expected_aikea_yaml:
            schema_version: 8
            units: mm
            measured_space:
              top_boundary: flat
              width_measurements: {bottom: 2730, middle: 2730, top: 2730}
              depth_measurements: {single: 620}
              height_measurements:
                - {distance_from_left: 0, height_from_floor: 2400}
                - {distance_from_left: 1365, height_from_floor: 2400}
                - {distance_from_left: 2730, height_from_floor: 2400}
            design_decisions: *fixture_material_decisions
            design_settings:
