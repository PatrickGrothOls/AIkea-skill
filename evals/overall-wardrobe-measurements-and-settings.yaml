                cabinet_gap: 5
                ceiling_clearance: 20
              base: {height: 100}
              doors: {gap: 2}
              materials:
                cabinet_panel_thickness: 18
                door_thickness: 20
                back_panel_thickness: 6
          expected_calculated:
            minimum_measured_width_mm: 2730
            minimum_measured_depth_mm: 620
            width_fitting_allowance_mm: 2
            depth_fitting_allowance_mm: 0
            height_fitting_allowance_mm: 2
            usable_width_mm: 2728
            usable_depth_mm: 620
            cabinet_depth_mm: 600
            inside_depth_mm: 594
            cabinets:
              - {cabinet_number: 1, left_position_mm: 10, right_position_mm: 909.333333, width_mm: 899.333333, left_height_mm: 2278, right_height_mm: 2278, door_width_mm: 897.333333}
              - {cabinet_number: 2, left_position_mm: 914.333333, right_position_mm: 1813.666667, width_mm: 899.333333, left_height_mm: 2278, right_height_mm: 2278, door_width_mm: 897.333333}
