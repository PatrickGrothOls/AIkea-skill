name: build-unit-taxonomy
type: eval_set
skill: aikea-build-units
run_mode: manual_fresh_chat
purpose: Score whether AIkea automatically creates populated local unit folders from a complete project.
environment_guide: manual-eval-environment.md

fixture_material_decisions: &fixture_material_decisions
  - subject: cabinet_carcass_material
    decision: Evaluation fixture cabinet panel
    design_effect: Use the approved fixture product at the project thickness.
    client_statement: The exact fixture product and sample are already approved.
  - subject: door_front_material
    decision: Evaluation fixture door panel
    design_effect: Use the approved fixture product at the project thickness.
    client_statement: The exact fixture product and sample are already approved.
  - subject: back_panel_material
    decision: Evaluation fixture back panel
    design_effect: Use the approved fixture product at the project thickness.
    client_statement: The exact fixture product and sample are already approved.

scoring:
  pass_when:
    - The bundled generator is run without another client question.
    - Every expected file exists and imports successfully.
    - Every expected local value matches the answer key.
    - Every supported joint produces the matching work on all participating parts.
    - Existing differing local files are preserved and reported as conflicts.
    - A changed unit run refreshes only files that still match the last successful generation.
    - The first cabinet is built and opened for visual review after generation.
  always_forbidden:
    - Ask the client to choose folder names or internal identifiers.
    - Hand-author calculated local dimensions instead of using the bundled generator.
    - Stop after summarizing the overall unit arrangement.
    - Claim that unsupported joints or manufacturing stages are complete.
    - Produce the remaining cabinet GLBs before the first cabinet is visually approved.

cases:
  - name: three equal full-height storage units
    starting_project:
      aikea_yaml:
        schema_version: 8
        units: cm
        measured_space:
          top_boundary: flat
          width_measurements: {bottom: 300, middle: 300, top: 300}
          depth_measurements: {single: 60}
          height_measurements:
            - {distance_from_left: 0, height_from_floor: 240}
            - {distance_from_left: 150, height_from_floor: 239.8}
            - {distance_from_left: 300, height_from_floor: 239.6}
        design_decisions: *fixture_material_decisions
        design_settings:
          fit_allowance: 0.2
          fitted_dimensions: {width: true, depth: false, height: true}
          assembly_run:
            left_clearance: 1
            right_clearance: 1
            gap: 0.2
            ceiling_clearance: 1
            assemblies:
              - {id: tall_storage_01, purpose: tall_storage, width_share: 1}
              - {id: tall_storage_02, purpose: tall_storage, width_share: 1}
              - {id: tall_storage_03, purpose: tall_storage, width_share: 1}
          base: {height: 10}
          doors: {gap: 0.2}
          materials:
            cabinet_panel_thickness: 1.8
            door_thickness: 1.8
            back_panel_thickness: 1.8
    next_user_message: great
    answer_key:
      response_required:
        - Generate the local unit taxonomy automatically.
        - Report the three calculated local units in client-facing language.
        - Build and open only the first cabinet for visual approval.
        - Continue without asking the client to approve folder creation.
      expected_next_stage: aikea-review-unit
      expected_paths_per_storage_assembly:
        - spec.py
        - builder.py
        - joints/spec.py
        - parts/left_side/spec.py
        - parts/left_side/builder.py
        - parts/right_side/spec.py
        - parts/right_side/builder.py
        - parts/back_panel/spec.py
        - parts/back_panel/builder.py
        - parts/door_panel/spec.py
        - parts/door_panel/builder.py
        - parts/shelf_01/spec.py
        - parts/shelf_01/builder.py
        - parts/shelf_02/spec.py
        - parts/shelf_02/builder.py
        - parts/shelf_03/spec.py
        - parts/shelf_03/builder.py
        - parts/top_panel_01/spec.py
        - parts/top_panel_01/builder.py
      expected_first_assembly:
        global_left_mm: 10
        global_right_mm: 1001.333333
        width_mm: 991.333333
        top: [[0, 2284], [991.333333, 2284]]
        depth_mm: 582
        inside_depth_mm: 564
        door_height_mm: 2384
        side_panel_height_mm: 2266
        top_panel_width_mm: 991.333333
        shelf_count: 3
        shelf_width_mm: 955.333333
        shelf_support_rows_mm: [612, 1124, 1636]
        side_hole_columns_mm: [37, 527]
      expected_first_joint:
        joint_id: left_side_to_top
        joint_type: cabineo
        source_part_id: left_side
        target_part_id: top_panel_01
        source_face: ">Z"
        source_edge: ">Y"
        connector_layout: bounded_spacing
        connectors: 2
        cuts_per_connector: 2
      expected_base:
        assembly_id: base_01
        width_mm: 2978
        depth_mm: 582
        height_mm: 100
        module_spans_mm:
          - [0, 992.333333]
          - [992.333333, 2978]
        deck_count: 2
        rail_count: 4
        brace_count: 13
        paths:
          - spec.py
          - builder.py
          - joints/spec.py

  - name: revise three equal units to four
    starting_project:
      generated_taxonomy: true
      aikea_yaml:
        schema_version: 8
        units: cm
        measured_space:
          top_boundary: flat
          width_measurements: {bottom: 300, middle: 300, top: 300}
          depth_measurements: {single: 60}
          height_measurements:
            - {distance_from_left: 0, height_from_floor: 240}
            - {distance_from_left: 150, height_from_floor: 239.8}
            - {distance_from_left: 300, height_from_floor: 239.6}
        design_decisions: *fixture_material_decisions
        design_settings:
          fit_allowance: 0.2
          fitted_dimensions: {width: true, depth: false, height: true}
          assembly_run:
            left_clearance: 1
            right_clearance: 1
            gap: 0.2
            ceiling_clearance: 1
            assemblies:
              - {id: tall_storage_01, purpose: tall_storage, width_share: 1}
              - {id: tall_storage_02, purpose: tall_storage, width_share: 1}
              - {id: tall_storage_03, purpose: tall_storage, width_share: 1}
          base: {height: 10}
          doors: {gap: 0.2}
          materials:
            cabinet_panel_thickness: 1.8
            door_thickness: 1.8
            back_panel_thickness: 1.8
    next_user_message: Make this four equal cabinets instead.
    answer_key:
      response_required:
        - Recalculate and regenerate the complete four-cabinet project automatically.
        - Report the revised four-unit arrangement in client-facing language.
        - Rebuild and open the revised first cabinet for visual approval.
        - End with the visual approval request rather than another design question.
      expected_next_stage: aikea-review-unit
      expected_assembly_run:
        - {id: tall_storage_01, purpose: tall_storage, width_share: 1}
        - {id: tall_storage_02, purpose: tall_storage, width_share: 1}
        - {id: tall_storage_03, purpose: tall_storage, width_share: 1}
        - {id: tall_storage_04, purpose: tall_storage, width_share: 1}
      expected_storage_assemblies:
        - {id: tall_storage_01, left_mm: 10, right_mm: 753, width_mm: 743}
        - {id: tall_storage_02, left_mm: 755, right_mm: 1498, width_mm: 743}
        - {id: tall_storage_03, left_mm: 1500, right_mm: 2243, width_mm: 743}
        - {id: tall_storage_04, left_mm: 2245, right_mm: 2988, width_mm: 743}
      expected_base:
        width_mm: 2978
        module_spans_mm: [[0, 1489], [1489, 2978]]
        deck_count: 2
        rail_count: 4
        brace_count: 12
      expected_generated_record: assemblies/generated-files.json
