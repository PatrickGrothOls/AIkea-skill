name: overall-wardrobe-intake
skill: aikea
cases:
  - name: ask for missing measurements
    prompt: Design a four-cabinet wall-to-wall wardrobe for this room.
    must:
      - Ask for the available width and depth.
      - Ask for ceiling points from left to right.
      - Ask for missing shared design settings.
      - Keep measurements separate from design settings.
    must_not:
      - Invent typical wardrobe dimensions.
      - Reuse measurements from legacy cabinet code, documentation, examples, or eval fixtures.
      - Ask for Cabineo cutter dimensions.
      - Ask for base rail spacing.

  - name: accept a flat measured space
    prompt: The space is 3000 mm wide, 600 mm deep, and 2400 mm high across the full width. Use three equal cabinets, a 100 mm base, 2 mm door gaps, 18 mm cabinet and door panels, and a 6 mm back. Use zero clearances and cabinet gaps.
    must:
      - Represent the ceiling with points at 0 mm and 3000 mm, both 2400 mm high.
      - Save three equal cabinet width shares.
      - Run the overall wardrobe calculator.
    must_not:
      - Create cabinet geometry before the input check passes.

  - name: preserve a flat section followed by a slope
    prompt: The wardrobe space is 3000 mm wide and 600 mm deep. The ceiling is 2400 mm high at the left, stays flat for 1000 mm, then slopes down to 1200 mm at the right.
    must:
      - Save ceiling points at distances 0, 1000, and 3000 mm.
      - Ask only for design settings that are still missing.
    must_not:
      - Reduce the ceiling to one average height.
      - Assume cabinet count, base height, gaps, or material thickness.
