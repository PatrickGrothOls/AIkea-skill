name: overall-wardrobe-intake
type: eval_set
skill: aikea
run_mode: manual_fresh_chat
purpose: Score how AIkea collects overall wardrobe inputs and writes the global project file.

manual_run:
  - Start a fresh Claude or Codex chat with the AIkea skill available.
  - Send each user message in order and save the response from every turn.
  - Compare the response and project file with that turn's answer key.
  - Record the model, pass or fail result, and short failure notes separately.

scoring:
  required_item_points: 1
  forbidden_item_result: fail_case
  project_file_result: exact_semantic_match
  calculated_result: numeric_match
  pass_when:
    - Every required response item is satisfied.
    - No forbidden response item occurs.
    - The final aikea.yaml semantically matches expected_aikea_yaml.
    - The calculator succeeds and matches expected_calculated.
  always_forbidden:
    - Invent measurements or typical cabinet defaults.
    - Reuse measurements from skill assets, eval cases, development docs, legacy code, or another project.
    - Ask the user for Cabineo cutter dimensions, Cabineo pocket coordinates, or base rail spacing.
    - Generate cabinet or joint geometry before the overall input check passes.

cases:
  - name: flat two-bay freestanding wardrobe
    wardrobe_type: freestanding, flat top, equal-width bays
    turns:
      - user: >-
          Design a freestanding two-door wardrobe. All measurements are in centimetres.
          The available width is 240, depth is 60, and the ceiling is flat at 220
          from the left edge at 0 to the right edge at 240. Use two equal cabinets,
          1 cm clearance on both sides and above, a 0.2 cm cabinet gap, a 10 cm base,
          a 0.2 cm door gap, 1.8 cm cabinet and door panels, and a 0.6 cm back panel.
        answer_key:
          response_required:
            - Recognize that every required overall input has been supplied.
            - Write a complete aikea.yaml using centimetres without changing the measurements.
            - Run the overall wardrobe calculator and report that the input is valid.
          response_forbidden:
            - Ask a follow-up measurement question.
          expected_aikea_yaml:
            schema_version: 1
            units: cm
            measured_space:
              width: 240
              depth: 60
              ceiling_points:
                - distance_from_left: 0
                  height_from_floor: 220
                - distance_from_left: 240
                  height_from_floor: 220
            design_settings:
              cabinet_run:
                cabinet_count: 2
                cabinet_width_shares: [1, 1]
                left_clearance: 1
                right_clearance: 1
                cabinet_gap: 0.2
                ceiling_clearance: 1
              base:
                height: 10
              doors:
                gap: 0.2
              materials:
                cabinet_panel_thickness: 1.8
                door_thickness: 1.8
                back_panel_thickness: 0.6
          expected_calculated:
            width_mm: 2400
            finished_depth_mm: 600
            cabinet_depth_mm: 582
            inside_depth_mm: 576
            cabinets:
              - {cabinet_number: 1, left_position_mm: 10, right_position_mm: 1199, width_mm: 1189, left_height_mm: 2090, right_height_mm: 2090, door_width_mm: 1187}
              - {cabinet_number: 2, left_position_mm: 1201, right_position_mm: 2390, width_mm: 1189, left_height_mm: 2090, right_height_mm: 2090, door_width_mm: 1187}

  - name: flat three-bay wall-to-wall wardrobe
    wardrobe_type: wall-to-wall, flat top, equal-width bays
    turns:
      - user: >-
          I measured a wall-to-wall space that is 3000 mm wide and 600 mm deep.
          The ceiling is flat at 2400 mm from the left edge to the right edge.
        answer_key:
          response_required:
            - Ask for cabinet count and width shares.
            - Ask for left, right, cabinet-gap, and ceiling clearances.
            - Ask for base height, door gap, and all three material thicknesses.
          response_forbidden:
            - Claim that the overall input is complete.
            - Run the calculator as though missing choices were zero.
          expected_project_state: incomplete_or_absent
      - user: >-
          Make three equal cabinets. Use zero left and right clearance and zero gaps
          between cabinets, with 10 mm ceiling clearance. The base is 100 mm high,
          the door gap is 2 mm, cabinet and door panels are 18 mm, and the back is 6 mm.
        answer_key:
          response_required:
            - Write the complete aikea.yaml without asking for already supplied values.
            - Run the overall wardrobe calculator and report that the input is valid.
          response_forbidden:
            - Replace an intentional zero with a typical clearance or gap.
          expected_aikea_yaml:
            schema_version: 1
            units: mm
            measured_space:
              width: 3000
              depth: 600
              ceiling_points:
                - distance_from_left: 0
                  height_from_floor: 2400
                - distance_from_left: 3000
                  height_from_floor: 2400
            design_settings:
              cabinet_run:
                cabinet_count: 3
                cabinet_width_shares: [1, 1, 1]
                left_clearance: 0
                right_clearance: 0
                cabinet_gap: 0
                ceiling_clearance: 10
              base:
                height: 100
              doors:
                gap: 2
              materials:
                cabinet_panel_thickness: 18
                door_thickness: 18
                back_panel_thickness: 6
          expected_calculated:
            width_mm: 3000
            finished_depth_mm: 600
            cabinet_depth_mm: 582
            inside_depth_mm: 576
            cabinets:
              - {cabinet_number: 1, left_position_mm: 0, right_position_mm: 1000, width_mm: 1000, left_height_mm: 2290, right_height_mm: 2290, door_width_mm: 998}
              - {cabinet_number: 2, left_position_mm: 1000, right_position_mm: 2000, width_mm: 1000, left_height_mm: 2290, right_height_mm: 2290, door_width_mm: 998}
              - {cabinet_number: 3, left_position_mm: 2000, right_position_mm: 3000, width_mm: 1000, left_height_mm: 2290, right_height_mm: 2290, door_width_mm: 998}

