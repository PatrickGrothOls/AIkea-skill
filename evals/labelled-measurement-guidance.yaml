name: labelled-measurement-guidance
type: eval_set
skill: aikea
run_mode: manual_fresh_chat
purpose: Score whether AIkea uses the labelled outline to choose measurements that reveal the real fitting surfaces and shape.
environment_guide: manual-eval-environment.md

scoring:
  required_item_points: 1
  forbidden_item_result: fail_case
  pass_when:
    - Every required response item is satisfied.
    - No forbidden response item occurs.
    - The response asks about only the next unfinished measurement or design topic.
  always_forbidden:
    - Drop the established edge labels and rely on ambiguous positions alone.
    - Request a line that ends on a different surface merely to complete a standard count.
    - Invent a measurement, feature, or shape not supplied by the client.
    - Expose project-file fields or calculation mechanics to the client.

cases:
  - name: choose useful width lines below a slope
    established_outline: A left wall, B top flat, C slope, D short right wall, E floor
    chat_history:
      - role: user
        text: All five labelled edges are fitted inside the alcove.
      - role: assistant
        text: Does the wardrobe front need to finish flush with the surrounding wall or another fixed line?
    next_user_message: Yes, it should finish flush with the surrounding wall.
    answer_key:
      response_required:
        - Retain that depth must finish at the fixed front line, without asking for depth yet.
        - Ask next for widths between side edges A and D only where both walls exist below the C-D junction.
        - Locate the useful lines with labels, such as just above E, midway up the shared A-D wall height, and just below C-D.
        - Make clear that these lines compare the same walls and can expose lean, bow, or taper.
      response_forbidden:
        - Ask for a top width that terminates on slope C.
        - Treat the length of top-flat edge B as the third wall-to-wall width.
        - Ask for width and depth in the same response.

  - name: locate repeated flush-depth readings on the outline
    established_outline: A left wall, B top flat, C slope, D short right wall, E floor
    chat_history:
      - role: user
        text: The front must finish flush with the surrounding wall. Widths between A and D just above E, midway up their shared height, and just below C-D are all 250 cm.
    next_user_message: What should I measure next?
    answer_key:
      response_required:
        - Ask only for depth from the back boundary to the fixed finished-front line.
        - Request readings near A, at the centre of floor edge E, and near D.
        - Explain briefly that comparing those same two depth boundaries reveals whether either line runs out of square.
      response_forbidden:
        - Ask for only one depth after the fixed flush line was established.
        - Use left, middle, and right without tying them to A, E, and D.
        - Ask for height in the same response.

  - name: capture every top change without assuming the slope
    established_outline: A left wall, B top flat, C slope, D short right wall, E floor
    chat_history:
      - role: user
        text: Width checks between A and D are complete. Flush depths near A, at the centre of E, and near D are 60, 59.8, and 60 cm.
    next_user_message: What comes after that?
    answer_key:
      response_required:
        - Ask only for vertical heights from floor edge E to the top boundary.
        - Request heights at junctions A-B, B-C, and C-D, with each junction's horizontal distance from A.
        - Request a useful check along long slope C when needed to verify that the real surface follows the intended line.
        - Keep every requested position tied to the established labels.
      response_forbidden:
        - Ask only for generic left, centre, and right heights.
        - Infer the slope from its description without measuring its labelled endpoints.
        - Ask for a horizontal width that terminates on slope C.

  - name: accept a client-confirmed straight slope
    established_outline: A left wall, B top flat, C slope, D short right wall, E floor
    chat_history:
      - role: user
        text: The heights at B-C and C-D are measured, so both endpoints of edge C are known.
      - role: assistant
        text: Please take one additional height along edge C so I can check whether the slope is straight.
    next_user_message: Edge C is straight. Use its endpoints; another reading there would be impractical.
    answer_key:
      response_required:
        - Accept the client's confirmation that edge C is straight as sufficient evidence.
        - Use the measured B-C and C-D endpoints without requesting another reading on C.
        - Continue with only the next unfinished measurement or design topic.
      response_forbidden:
        - Describe the confirmed straightness as an assumption or unverified claim.
        - Ask the client to prove edge C is straight.
        - Repeat the request for an intermediate reading on edge C.
      expected_design_decision:
        subject: front_outline.edge_C
        decision: straight
        design_effect: use_measured_endpoints
        client_statement: Edge C is straight. Use its endpoints; another reading there would be impractical.
